<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de FPS / Hz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div>
      <h1 data-i18n="title">Test de FPS / Hz</h1>
      <p class="subtitle" data-i18n="subtitle">Cada bola se mueve a sus FPS. Si dos bolas se ven igual de suaves, tu monitor ya no puede mostrar más.</p>
    </div>
    <div class="header-boxes">
      <div class="box" data-i18n-title="hzTitle" title="Frecuencia medida con requestAnimationFrame">
        <span class="box-label" data-i18n="monitor">Tu monitor</span>
        <span class="hz-value" id="hzValue">Midiendo…</span>
      </div>
      <label class="box lang-box">
        <span class="box-label" data-i18n="language">Idioma</span>
        <select id="langSelect">
          <option value="es">Español</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="fr">Français</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="zh">中文</option>
        </select>
      </label>
    </div>
  </header>

  <main>
    <section class="stage" id="stage" data-i18n-aria="stageLabel" aria-label="Bolas en movimiento"></section>

    <section class="panel" data-i18n-aria="panelLabel" aria-label="Controles">
      <form class="add-form" id="addForm">
        <label for="newFps" data-i18n="addBall">Añadir bola</label>
        <input type="number" id="newFps" min="1" max="2500" step="any" data-i18n-placeholder="placeholder" placeholder="Ej. 240" required>
        <span class="unit">FPS</span>
        <button type="submit" data-i18n="add">Añadir</button>
      </form>

      <ul class="ball-list" id="ballList"></ul>

      <div class="controls">
        <button type="button" id="pauseBtn">Pausa</button>
        <label class="speed" for="speed">
          <span data-i18n="speed">Velocidad</span>
          <input type="range" id="speed" min="100" max="2000" step="50" value="600">
          <span id="speedValue">600 px/s</span>
        </label>
        <button type="button" id="resetBtn" class="secondary" data-i18n="reset">Restaurar por defecto</button>
      </div>

      <p class="hint"><span data-i18n="hintBefore">Pulsa </span><kbd data-i18n="spaceKey">Espacio</kbd><span data-i18n="hintAfter"> para pausar o reanudar. Los cambios se guardan en este navegador.</span></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
